# Personal sidebar options. ~/.tmux.conf sources this before TPM runs,
# because the plugin only fills in defaults for options still unset.

# List every pane, not just agents, so each window and session shows up.
set -g @sidebar_show_all_panes on
set -g @sidebar_notifications_events all
# Account label for Claude sessions on the default ~/.claude config dir;
# ~/.claude-<name> shows as <name>.
set -g @sidebar_claude_default_account ken
# Hide the Activity / Git panel; the pane list and the Usage section take the room.
set -g @sidebar_bottom_height 0
